name: Web demo

# builds the c++ sandbox with emscripten and the rust sandbox for webgpu (under /webgpu/); pushes to main publish them on
# github pages
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build (Emscripten)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - uses: mymindstorm/setup-emsdk@v14
        with:
          version: 4.0.10

      - name: Configure
        run: emcmake cmake -S . -B build-web -DCMAKE_BUILD_TYPE=Release -DTINYSPH_BUILD_TESTS=OFF -DTINYSPH_BUILD_EXAMPLES=OFF -DTINYSPH_INSTALL=OFF

      - name: Build
        run: cmake --build build-web --parallel --target tinysph_sandbox

      - name: Collect the page
        run: |
          mkdir site
          cp build-web/sandbox/index.html build-web/sandbox/index.js build-web/sandbox/index.wasm site/
          ls -l site

      # the rust sandbox on webgpu, published under /webgpu/ next to the c++ demo
      - name: Install Rust and wasm-bindgen
        working-directory: rust
        run: |
          rustup toolchain install stable --profile minimal --target wasm32-unknown-unknown
          rustup default stable
          # the same exact version as the wasm-bindgen crate in rust/sandbox/Cargo.toml
          cargo install wasm-bindgen-cli --version 0.2.130 --locked

      - name: Build the WebGPU sandbox
        run: |
          sh rust/sandbox/build_web.sh
          mkdir site/webgpu
          cp -r rust/sandbox/dist/. site/webgpu/
          ls -lR site

      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    name: Deploy to GitHub Pages
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
