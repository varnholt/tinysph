name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  library:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Windows MSVC
            os: windows-latest
            configure: ""
          - name: Linux GCC 14
            os: ubuntu-24.04
            configure: -DCMAKE_CXX_COMPILER=g++-14
          - name: Linux Clang 20
            os: ubuntu-24.04
            configure: -DCMAKE_CXX_COMPILER=clang++-20
          - name: macOS AppleClang
            os: macos-15
            configure: ""
          # the gpu backend on software or virtual gpus: lavapipe (mesa vulkan), warp (d3d12) and the runner's metal device.
          # require_gpu fails the tests instead of skipping the gpu backend when no adapter is found
          - name: Linux GCC 14, GPU (lavapipe)
            os: ubuntu-24.04
            configure: -DCMAKE_CXX_COMPILER=g++-14 -DTINYSPH_GPU=ON
            require_gpu: "1"
          - name: Windows MSVC, GPU (WARP)
            os: windows-latest
            configure: -DTINYSPH_GPU=ON
            require_gpu: "1"
          - name: macOS AppleClang, GPU (Metal)
            os: macos-15
            configure: -DTINYSPH_GPU=ON
            require_gpu: ""

    steps:
      - uses: actions/checkout@v4

      - name: Install TBB (parallel algorithms for libstdc++)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libtbb-dev

      - name: Install lavapipe (software vulkan)
        if: runner.os == 'Linux' && contains(matrix.configure, 'TINYSPH_GPU=ON')
        run: sudo apt-get install -y mesa-vulkan-drivers

      # clang 18 cannot use libstdc++'s std::expected (needs __cpp_concepts 202002), clang 19+ can
      - name: Install Clang 20
        if: contains(matrix.configure, 'clang++-20')
        run: |
          wget -q https://apt.llvm.org/llvm.sh
          sudo bash llvm.sh 20

      - name: Configure
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release -DTINYSPH_BUILD_SANDBOX=OFF ${{ matrix.configure }}

      - name: Build
        run: cmake --build build --config Release --parallel

      - name: Test
        env:
          TINYSPH_REQUIRE_GPU: ${{ matrix.require_gpu }}
        run: ctest --test-dir build -C Release --output-on-failure --verbose

      - name: Example
        shell: bash
        run: |
          if [ -f build/examples/Release/hello_fluid.exe ]; then build/examples/Release/hello_fluid.exe; else build/examples/hello_fluid; fi

      - name: Install and consume with find_package
        shell: bash
        run: |
          cmake --install build --config Release --prefix "$PWD/install"
          mkdir consumer
          cat > consumer/CMakeLists.txt <<'EOF'
          cmake_minimum_required(VERSION 3.25)
          project(consumer LANGUAGES CXX)
          find_package(tinysph 0.1 REQUIRED)
          add_executable(consumer main.cpp)
          target_link_libraries(consumer PRIVATE tinysph::tinysph)
          EOF
          cat > consumer/main.cpp <<'EOF'
          #include <chrono>
          #include <print>
          #include <tinysph/tinysph.h>
          int main()
          {
             using namespace std::chrono_literals;
             tinysph::World world;
             world.addFluid(tinysph::Sphere{{0.5f, 0.5f, 0.5f}, 0.1f});
             world.step(100ms);
             std::println("consumer ok: {} particles", world.particleCount());
          }
          EOF
          cmake -S consumer -B consumer/build -DCMAKE_BUILD_TYPE=Release -DCMAKE_PREFIX_PATH="$PWD/install" ${{ matrix.configure }}
          cmake --build consumer/build --config Release
          # with the gpu backend the consumer also loads the bundled wgpu-native, which windows looks for on the PATH
          export PATH="$PWD/install/bin:$PATH"
          if [ -f consumer/build/Release/consumer.exe ]; then consumer/build/Release/consumer.exe; else consumer/build/consumer; fi

  sandbox:
    name: Sandbox (Windows)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Configure
        run: cmake -S . -B build -DTINYSPH_BUILD_TESTS=OFF -DTINYSPH_BUILD_EXAMPLES=OFF -DTINYSPH_GPU=ON

      - name: Build
        run: cmake --build build --config Release --parallel --target tinysph_sandbox

  rust:
    name: Rust (${{ matrix.os }}, ${{ matrix.toolchain }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            toolchain: stable
          - os: windows-latest
            toolchain: stable
          - os: macos-15
            toolchain: stable
          - os: ubuntu-24.04
            toolchain: "1.85" # rust-version in rust/Cargo.toml
    defaults:
      run:
        working-directory: rust
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust ${{ matrix.toolchain }}
        run: |
          rustup toolchain install ${{ matrix.toolchain }} --profile minimal --component clippy,rustfmt
          rustup default ${{ matrix.toolchain }}

      # the default build has no dependencies at all; wgpu comes in only with the gpu feature
      - name: No dependencies
        shell: bash
        run: |
          cargo tree -e normal,build --prefix none
          test "$(cargo tree -e normal,build --prefix none | wc -l)" -eq 1

      - name: Format and lint
        if: matrix.toolchain == 'stable'
        run: |
          cargo fmt --check
          cargo clippy --all-targets -- -D warnings

      # debug builds panic on integer overflow. tests/parity.rs compares with the c++ trace in tests/data/trace.txt;
      # it prints whether the particle data matches bit for bit but only asserts the aggregates within a tolerance
      - name: Test in debug and release
        run: |
          cargo test
          cargo test --release -- --nocapture

      - name: Docs and package
        if: matrix.toolchain == 'stable'
        shell: bash
        run: |
          RUSTDOCFLAGS="-D warnings" cargo doc --no-deps
          cargo package --allow-dirty

      - name: Examples
        run: |
          cargo run --release --example hello_fluid
          cargo run --release --example dam_break -- 30 0.2 0.5

  # the gpu feature on lavapipe (mesa's software vulkan), like the c++ "Linux GCC 14, GPU (lavapipe)" job. wgpu needs
  # rust 1.87, so this runs on stable only; TINYSPH_REQUIRE_GPU fails the gpu tests instead of skipping them
  rust-gpu:
    name: Rust GPU (lavapipe)
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: rust
    env:
      TINYSPH_REQUIRE_GPU: "1"
    steps:
      - uses: actions/checkout@v4

      - name: Install lavapipe (software vulkan)
        run: sudo apt-get update && sudo apt-get install -y mesa-vulkan-drivers

      - name: Install Rust stable
        run: |
          rustup toolchain install stable --profile minimal --component clippy,rustfmt
          rustup default stable

      - name: Lint
        run: cargo clippy --all-targets --features gpu -- -D warnings

      - name: Test in debug and release
        run: |
          cargo test --features gpu -- --nocapture
          cargo test --release --features gpu -- --nocapture

      - name: Docs and package
        shell: bash
        run: |
          RUSTDOCFLAGS="-D warnings" cargo doc --no-deps --features gpu
          cargo package --allow-dirty --features gpu

      - name: Example
        run: cargo run --release --features gpu --example dam_break -- --gpu 30 0.2 0.5

  # the interactive sandbox (rust/sandbox, egui on wgpu): lint and build natively and for the browser. it needs a newer
  # rust than the library (egui 0.36 on wgpu 30). on linux it also renders a few frames on lavapipe in xvfb
  rust-sandbox:
    name: Rust sandbox (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-latest]
    defaults:
      run:
        working-directory: rust
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust stable
        run: |
          rustup toolchain install stable --profile minimal --component clippy,rustfmt --target wasm32-unknown-unknown
          rustup default stable

      - name: Lint
        run: |
          cargo fmt --all --check
          cargo clippy -p tinysph-sandbox --all-targets -- -D warnings

      - name: Build
        run: cargo build --release -p tinysph-sandbox

      - name: Lint and build for the browser
        if: runner.os == 'Linux'
        run: |
          cargo clippy -p tinysph-sandbox --target wasm32-unknown-unknown -- -D warnings
          cargo build --release -p tinysph-sandbox --target wasm32-unknown-unknown

      - name: Capture frames on lavapipe
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update && sudo apt-get install -y mesa-vulkan-drivers xvfb libxkbcommon-x11-0
          xvfb-run -a -s "-screen 0 1280x720x24" target/release/tinysph-sandbox --preset 0 --capture capture --frames 30
          test -f capture/frame_0029.png

      - uses: actions/upload-artifact@v4
        if: runner.os == 'Linux'
        with:
          name: sandbox-capture
          path: rust/capture
